name: Public Release Security & Quality Gate

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  security-and-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest opencv-python numpy PyYAML || true

    - name: Run Desensitization & Security Audit
      run: |
        chmod +x scripts/audit_public_release.py
        python3 scripts/audit_public_release.py
